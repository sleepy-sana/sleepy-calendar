<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>sleepy calendar</title>

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#9ed3f2">
<meta name="mobile-web-app-capable" content="yes">
  
</head>

<body>

  <div class="app">

    <!-- =========================
         Header
    ========================== -->

    <header class="header">

      <div class="logo-area">
        <div class="logo">sleepy calendar</div>
        <div class="subtitle">☁️ little plans, soft days 🌙</div>
      </div>

      <button
        type="button"
        id="todayButton"
        class="today-button"
      >
        今日
      </button>

    </header>


    <!-- =========================
         Main
    ========================== -->

    <main class="main-layout">


      <!-- =========================
           Calendar
      ========================== -->

      <section class="calendar-card">

        <div class="calendar-header">

          <button
            type="button"
            id="prevMonth"
            class="month-button"
          >
            ‹
          </button>

          <h1 id="monthTitle">
            2026年 10月
          </h1>

          <button
            type="button"
            id="nextMonth"
            class="month-button"
          >
            ›
          </button>

        </div>


        <div class="weekdays">

          <div>日</div>
          <div>月</div>
          <div>火</div>
          <div>水</div>
          <div>木</div>
          <div>金</div>
          <div>土</div>

        </div>


        <div
          id="calendarGrid"
          class="calendar-grid"
        ></div>


        <div class="calendar-note">
          <span class="legend-dot blue"></span>
          予定
          <span class="legend-dot period"></span>
          生理
        </div>

      </section>


      <!-- =========================
           Side
      ========================== -->

      <aside class="side">


        <!-- Selected Date -->

        <section class="card selected-card">

          <div class="card-label">
            SELECTED DAY
          </div>

          <div
            id="selectedDate"
            class="selected-date"
          >
            -
          </div>

        </section>


        <!-- =========================
             Events
        ========================== -->

        <section class="card">

          <div class="card-title-row">

            <div>
              <div class="card-label">
                EVENTS
              </div>

              <h2>予定 🌙</h2>
            </div>

            <button
              type="button"
              id="addEvent"
              class="add-button"
            >
              ＋
            </button>

          </div>


          <div
            id="events"
            class="event-list"
          ></div>

        </section>


        <!-- =========================
             Memo
        ========================== -->

        <section class="card">

          <div class="card-title-row">

            <div>
              <div class="card-label">
                MEMO
              </div>

              <h2>メモ 📝</h2>
            </div>

            <button
              type="button"
              id="addMemo"
              class="add-button"
            >
              ＋
            </button>

          </div>


          <div
            id="memos"
            class="memo-list"
          ></div>

        </section>


        <!-- =========================
             Period
        ========================== -->

        <section class="card">

          <div class="card-title-row">

            <div>
              <div class="card-label">
                PERIOD
              </div>

              <h2>生理記録 🌷</h2>
            </div>

            <button
              type="button"
              id="addPeriod"
              class="small-button"
            >
              記録
            </button>

          </div>


          <div class="period-info">

            <div class="period-row">
              <span>最後の開始日</span>
              <strong id="lastPeriod">
                未登録
              </strong>
            </div>

            <div class="period-row">
              <span>平均周期</span>
              <strong id="averageCycle">
                未登録
              </strong>
            </div>

            <div class="period-row">
              <span>次回の予測</span>
              <strong id="nextPeriod">
                未登録
              </strong>
            </div>

          </div>


          <div class="period-history-title">
            HISTORY
          </div>

          <div
            id="periodHistory"
            class="period-history"
          ></div>

        </section>


        <!-- =========================
             Todo
        ========================== -->

        <section class="card">

          <div class="card-label">
            TODO
          </div>

          <h2>やること 💤</h2>


          <form
            id="todoForm"
            class="todo-form"
          >

            <input
              id="todoInput"
              type="text"
              placeholder="やることを入力..."
              autocomplete="off"
            >

            <button
              type="submit"
              class="add-button"
            >
              ＋
            </button>

          </form>


          <div
            id="todoList"
            class="todo-list"
          ></div>

        </section>


      </aside>

    </main>

  </div>


  <!-- =========================
       Event Dialog
  ========================== -->

  <dialog id="eventDialog">

    <div class="dialog-content">

      <div class="dialog-header">

        <div>
          <div class="card-label">
            NEW PLAN
          </div>

          <h2>予定を追加 🌙</h2>
        </div>

        <button
          type="button"
          id="closeEvent"
          class="dialog-close"
        >
          ×
        </button>

      </div>


      <form id="eventForm">

        <!-- 日付 -->

        <label class="form-label">

          日付

          <input
            id="eventDate"
            type="date"
            required
          >

        </label>


        <!-- 時間 -->

        <label class="form-label">

          時間

          <input
            id="eventTime"
            type="time"
          >

        </label>


        <!-- 予定 -->

        <label class="form-label">

          予定

          <input
            id="eventTitle"
            type="text"
            placeholder="予定の名前..."
            autocomplete="off"
            required
          >

        </label>


        <!-- =========================
             Cute Color Picker
        ========================== -->

        <div class="event-color-picker">

          <span class="color-picker-label">
            予定の色 🌙
          </span>


          <div class="color-options">


            <!-- Blue -->

            <label class="color-option color-blue">

              <input
                type="radio"
                name="eventColor"
                value="blue"
                checked
              >

              <span class="color-dot"></span>

              <span class="color-name">
                sky
              </span>

            </label>


            <!-- Pink -->

            <label class="color-option color-pink">

              <input
                type="radio"
                name="eventColor"
                value="pink"
              >

              <span class="color-dot"></span>

              <span class="color-name">
                dream
              </span>

            </label>


            <!-- Purple -->

            <label class="color-option color-purple">

              <input
                type="radio"
                name="eventColor"
                value="purple"
              >

              <span class="color-dot"></span>

              <span class="color-name">
                moon
              </span>

            </label>


            <!-- Yellow -->

            <label class="color-option color-yellow">

              <input
                type="radio"
                name="eventColor"
                value="yellow"
              >

              <span class="color-dot"></span>

              <span class="color-name">
                star
              </span>

            </label>


            <!-- Green -->

            <label class="color-option color-green">

              <input
                type="radio"
                name="eventColor"
                value="green"
              >

              <span class="color-dot"></span>

              <span class="color-name">
                mint
              </span>

            </label>


          </div>

        </div>


        <!-- 保存 -->

        <button
          type="submit"
          class="save-button"
        >
          予定を保存 💤
        </button>

      </form>

    </div>

  </dialog>


  <!-- =========================
       Memo Dialog
  ========================== -->

  <dialog id="memoDialog">

    <div class="dialog-content">

      <div class="dialog-header">

        <div>
          <div class="card-label">
            LITTLE NOTE
          </div>

          <h2>メモを追加 📝</h2>
        </div>

        <button
          type="button"
          id="closeMemo"
          class="dialog-close"
        >
          ×
        </button>

      </div>


      <form id="memoForm">

        <label class="form-label">

          メモ

          <textarea
            id="memoText"
            rows="5"
            placeholder="ここにメモを書いてね..."
            required
          ></textarea>

        </label>


        <button
          type="submit"
          class="save-button"
        >
          メモを保存 📝
        </button>

      </form>

    </div>

  </dialog>


  <!-- =========================
       JavaScript
  ========================== -->

  <script src="app.js"></script>

</body>
</html>
