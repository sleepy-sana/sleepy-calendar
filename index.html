<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>sleepy calendar</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- ==========================
       ヘッダー
  =========================== -->

  <header class="header">

    <div>
      <h1>🌙 sleepy calendar</h1>
      <p>ゆっくり、かわいく、予定を管理。</p>
    </div>

    <button
      id="todayButton"
      class="today-button"
    >
      今日
    </button>

  </header>


  <main class="container">

    <!-- ==========================
         カレンダー
    =========================== -->

    <section class="calendar-card">

      <div class="calendar-header">

        <button
          id="prevMonth"
          class="nav-button"
        >
          ‹
        </button>

        <h2 id="monthTitle"></h2>

        <button
          id="nextMonth"
          class="nav-button"
        >
          ›
        </button>

      </div>


      <!-- 曜日 -->

      <div class="weekdays">

        <div>日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div>土</div>

      </div>


      <!-- 日付 -->

      <div
        id="calendarGrid"
        class="calendar-grid"
      ></div>

    </section>


    <!-- ==========================
         サイド
    =========================== -->

    <aside class="side">

      <!-- ========================
           選択した日
      ========================= -->

      <section class="card">

        <div class="card-header">

          <div>

            <p class="small-title">
              SELECTED DAY
            </p>

            <h2 id="selectedDate">
              日付
            </h2>

          </div>

        </div>


        <!-- 予定 -->

        <div class="section-title-row">

          <h3>📅 予定</h3>

          <button
            id="addEvent"
            class="add-button"
          >
            ＋
          </button>

        </div>


        <div
          id="events"
          class="events"
        ></div>


        <!-- メモ -->

        <div class="section-title-row memo-title">

          <h3>📝 メモ</h3>

          <button
            id="addMemo"
            class="add-button"
          >
            ＋
          </button>

        </div>


        <div
          id="memos"
          class="memos"
        ></div>

      </section>


      <!-- ========================
           生理管理
      ========================= -->

      <section class="card">

        <div class="section-title-row">

          <h3>🌸 生理管理</h3>

        </div>


        <div class="period-info">

          <div class="period-box">

            <span>
              最終開始日
            </span>

            <strong id="lastPeriod">
              未登録
            </strong>

          </div>


          <div class="period-box">

            <span>
              平均周期
            </span>

            <strong id="averageCycle">
              —
            </strong>

          </div>


          <div class="period-box">

            <span>
              次回予測
            </span>

            <strong id="nextPeriod">
              —
            </strong>

          </div>

        </div>


        <button
          id="addPeriod"
          class="primary-button"
        >
          🌸 今日を開始日として記録
        </button>


        <h4>
          生理履歴
        </h4>

        <div
          id="periodHistory"
          class="period-history"
        ></div>

      </section>


      <!-- ========================
           ToDo
      ========================= -->

      <section class="card">

        <div class="section-title-row">

          <h3>✅ ToDo</h3>

        </div>


        <form
          id="todoForm"
          class="todo-form"
        >

          <input
            id="todoInput"
            type="text"
            placeholder="やることを入力..."
            autocomplete="off"
          >

          <button
            type="submit"
            class="add-button"
          >
            ＋
          </button>

        </form>


        <ul
          id="todoList"
          class="todo-list"
        ></ul>

      </section>

    </aside>

  </main>


  <!-- ==========================
       予定追加・編集ダイアログ
  =========================== -->

  <dialog
    id="eventDialog"
    class="dialog"
  >

    <form
      id="eventForm"
      method="dialog"
    >

      <h2>📅 予定</h2>


      <label>
        日付

        <input
          id="eventDate"
          type="date"
          required
        >

      </label>


      <label>
        時間

        <input
          id="eventTime"
          type="time"
        >

      </label>


      <label>
        予定

        <input
          id="eventTitle"
          type="text"
          placeholder="例：Twitch配信"
          required
          autocomplete="off"
        >
        
<div class="event-color-picker">
  <span class="color-picker-label">予定の色 🌙</span>

  <div class="color-options">
    <label class="color-option color-blue">
      <input type="radio" name="eventColor" value="blue" checked>
      <span class="color-dot"></span>
      <span class="color-name">sky</span>
    </label>

    <label class="color-option color-pink">
      <input type="radio" name="eventColor" value="pink">
      <span class="color-dot"></span>
      <span class="color-name">dream</span>
    </label>

    <label class="color-option color-purple">
      <input type="radio" name="eventColor" value="purple">
      <span class="color-dot"></span>
      <span class="color-name">moon</span>
    </label>

    <label class="color-option color-yellow">
      <input type="radio" name="eventColor" value="yellow">
      <span class="color-dot"></span>
      <span class="color-name">star</span>
    </label>

    <label class="color-option color-green">
      <input type="radio" name="eventColor" value="green">
      <span class="color-dot"></span>
      <span class="color-name">mint</span>
    </label>
  </div>
</div>
        
      </label>


      <div class="dialog-buttons">

        <button
          type="button"
          id="closeEvent"
          class="cancel-button"
        >
          キャンセル
        </button>

        <button
          type="submit"
          class="primary-button"
        >
          保存
        </button>

      </div>

    </form>

  </dialog>


  <!-- ==========================
       メモ追加ダイアログ
  =========================== -->

  <dialog
    id="memoDialog"
    class="dialog"
  >

    <form
      id="memoForm"
      method="dialog"
    >

      <h2>📝 メモ</h2>


      <label>
        メモ

        <textarea
          id="memoText"
          placeholder="ここにメモを書いてね..."
          rows="5"
          required
        ></textarea>

      </label>


      <div class="dialog-buttons">

        <button
          type="button"
          id="closeMemo"
          class="cancel-button"
        >
          キャンセル
        </button>

        <button
          type="submit"
          class="primary-button"
        >
          保存
        </button>

      </div>

    </form>

  </dialog>


  <script src="app.js"></script>

</body>

</html>
